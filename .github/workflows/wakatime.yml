name: WakaTime Stats Card Sync

on:
  schedule:
    # Runs everyday at midnight UTC
    - cron: '0 0 * * *'
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - 'scripts/**'
      - '.github/workflows/wakatime.yml'

jobs:
  sync-wakatime-card:
    name: Generate & Sync WakaTime SVG Card
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Generate WakaTime SVG Card
        env:
          WAKATIME_API_KEY: ${{ secrets.WAKATIME_API_KEY }}
        run: |
          python scripts/generate_waka_card.py

      - name: Commit and Push Updated SVG
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/wakatime.svg
          if git diff --staged --quiet; then
            echo "No changes to commit."
          else
            git commit -m "⚡ sync: update WakaTime stats card [skip ci]"
            git push origin main
          fi
