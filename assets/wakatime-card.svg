          <text x="16" y="9" fill="#c9d1d9" font-size="12" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,Helvetica,Arial,sans-serif" font-weight="600">Dart</text>
          <text x="340" y="9" fill="#8b949e" font-size="12" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,Helvetica,Arial,sans-serif" text-anchor="end">68.3% (39 mins)</text>
        </g>
        <g transform="translate(420, 129)">
          <circle cx="5" cy="5" r="4" fill="#8b949e" />
          <text x="16" y="9" fill="#c9d1d9" font-size="12" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,Helvetica,Arial,sans-serif" font-weight="600">Other</text>
          <text x="340" y="9" fill="#8b949e" font-size="12" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,Helvetica,Arial,sans-serif" text-anchor="end">25.5% (14 mins)</text>
        </g>
        <g transform="translate(420, 153)">
          <circle cx="5" cy="5" r="4" fill="#083FA1" />
          <text x="16" y="9" fill="#c9d1d9" font-size="12" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,Helvetica,Arial,sans-serif" font-weight="600">Markdown</text>
          <text x="340" y="9" fill="#8b949e" font-size="12" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,Helvetica,Arial,sans-serif" text-anchor="end">6.2% (3 mins)</text>
        </g>

  <!-- Card Footer -->
  <line x1="25" y1="210" x2="775" y2="210" stroke="#21262D" stroke-width="1" />
  <text x="25" y="222" class="footer-text">🔄 Auto-generated &amp; Self-Hosted via GitHub Actions</text>
