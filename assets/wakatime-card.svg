<svg
  width="300"
  height="215"
  viewBox="0 0 300 215"
  fill="none"
  xmlns="http://www.w3.org/2000/svg"
  role="img"
  aria-labelledby="descId"
>
  <title id="titleId">Weekly Coding Activity (WakaTime)</title>
  <desc id="descId">Tracked development velocity and language metrics</desc>
  <style>
    .header {
      font: 600 18px 'Segoe UI', Ubuntu, Sans-Serif;
      fill: #00FF7F;
      animation: fadeInAnimation 0.8s ease-in-out forwards;
    }
    @supports(-moz-appearance: auto) {
      .header { font-size: 15.5px; }
    }
    
    @keyframes slideInAnimation {
      from { width: 0; }
      to { width: calc(100% - 100px); }
    }
    @keyframes growWidthAnimation {
      from { width: 0; }
      to { width: 100%; }
    }
    .stat {
      font: 600 14px 'Segoe UI', Ubuntu, "Helvetica Neue", Sans-Serif; fill: #c9d1d9;
    }
    @supports(-moz-appearance: auto) {
      .stat { font-size: 12px; }
    }
    .bold { font-weight: 700 }
    .lang-name {
      font: 400 11px "Segoe UI", Ubuntu, Sans-Serif;
      fill: #c9d1d9;
    }
    .stagger {
      opacity: 0;
      animation: fadeInAnimation 0.3s ease-in-out forwards;
    }
    #rect-mask rect {
      animation: slideInAnimation 1s ease-in-out forwards;
    }
    .lang-progress {
      animation: growWidthAnimation 0.6s ease-in-out forwards;
    }
    .progress-background { fill: #ddd; }
    
    @keyframes scaleInAnimation {
      from { transform: translate(-5px, 5px) scale(0); }
      to { transform: translate(-5px, 5px) scale(1); }
    }
    @keyframes fadeInAnimation {
      from { opacity: 0; }
      to { opacity: 1; }
    }
  </style>

  <rect
    data-testid="card-bg"
    class="card-bg"
    x="0.5"
    y="0.5"
    rx="4.5"
    height="99%"
    stroke="#e4e2e2"
    width="299"
    fill="#0D1117"
    stroke-opacity="0"
  />

  <g data-testid="card-title" transform="translate(25, 35)">
    <g transform="translate(0, 0)">
      <text x="0" y="0" class="header" data-testid="header">Weekly Coding Activity</text>
    </g>
  </g>

  <g data-testid="main-card-body" transform="translate(0, 55)">
    <svg data-testid="lang-items" x="25">
      <mask id="rect-mask">
        <rect x="0" y="0" width="250" height="8" fill="white" rx="5"/>
      </mask>
      
        <rect
          mask="url(#rect-mask)"
          data-testid="lang-progress"
          x="0.0"
          y="0"
          width="117.78"
          height="8"
          fill="#00B4AB"
        />
        <rect
          mask="url(#rect-mask)"
          data-testid="lang-progress"
          x="117.78"
          y="0"
          width="54.08"
          height="8"
          fill="#858585"
        />
        <rect
          mask="url(#rect-mask)"
          data-testid="lang-progress"
          x="171.86"
          y="0"
          width="27.35"
          height="8"
          fill="#f1e05a"
        />
        <rect
          mask="url(#rect-mask)"
          data-testid="lang-progress"
          x="199.21"
          y="0"
          width="19.88"
          height="8"
          fill="#858585"
        />
        <rect
          mask="url(#rect-mask)"
          data-testid="lang-progress"
          x="219.09"
          y="0"
          width="9.57"
          height="8"
          fill="#083fa1"
        />
        <rect
          mask="url(#rect-mask)"
          data-testid="lang-progress"
          x="228.66"
          y="0"
          width="7.22"
          height="8"
          fill="#858585"
        />
        <rect
          mask="url(#rect-mask)"
          data-testid="lang-progress"
          x="235.88"
          y="0"
          width="7.22"
          height="8"
          fill="#3572A5"
        />
        <rect
          mask="url(#rect-mask)"
          data-testid="lang-progress"
          x="243.1"
          y="0"
          width="6.92"
          height="8"
          fill="#cb171e"
        />

      <g transform="translate(0, 25)">
        <g transform="translate(0, 0)">
<g transform="translate(0, 0)">
    <g class="stagger" style="animation-delay: 450ms">
      <circle cx="5" cy="6" r="5" fill="#00B4AB" />
      <text data-testid="lang-name" x="15" y="10" class="lang-name">
        Dart 47.1% (9 hrs 28 mins)
      </text>
    </g>
  </g>
<g transform="translate(0, 25)">
    <g class="stagger" style="animation-delay: 750ms">
      <circle cx="5" cy="6" r="5" fill="#f1e05a" />
      <text data-testid="lang-name" x="15" y="10" class="lang-name">
        JavaScript 10.9% (2 hrs 12 mins)
      </text>
    </g>
  </g>
<g transform="translate(0, 50)">
    <g class="stagger" style="animation-delay: 1050ms">
      <circle cx="5" cy="6" r="5" fill="#083fa1" />
      <text data-testid="lang-name" x="15" y="10" class="lang-name">
        Markdown 3.8% (46 mins)
      </text>
    </g>
  </g>
<g transform="translate(0, 75)">
    <g class="stagger" style="animation-delay: 1350ms">
      <circle cx="5" cy="6" r="5" fill="#3572A5" />
      <text data-testid="lang-name" x="15" y="10" class="lang-name">
        Python 2.9% (34 mins)
      </text>
    </g>
  </g>
        </g>
        <g transform="translate(150, 0)">
<g transform="translate(0, 0)">
    <g class="stagger" style="animation-delay: 600ms">
      <circle cx="5" cy="6" r="5" fill="#858585" />
      <text data-testid="lang-name" x="15" y="10" class="lang-name">
        Other 21.6% (4 hrs 20 mins)
      </text>
    </g>
  </g>
<g transform="translate(0, 25)">
    <g class="stagger" style="animation-delay: 900ms">
      <circle cx="5" cy="6" r="5" fill="#858585" />
      <text data-testid="lang-name" x="15" y="10" class="lang-name">
        SQL 8.0% (1 hr 35 mins)
      </text>
    </g>
  </g>
<g transform="translate(0, 50)">
    <g class="stagger" style="animation-delay: 1200ms">
      <circle cx="5" cy="6" r="5" fill="#858585" />
      <text data-testid="lang-name" x="15" y="10" class="lang-name">
        Bash 2.9% (34 mins)
      </text>
    </g>
  </g>
<g transform="translate(0, 75)">
    <g class="stagger" style="animation-delay: 1500ms">
      <circle cx="5" cy="6" r="5" fill="#cb171e" />
      <text data-testid="lang-name" x="15" y="10" class="lang-name">
        YAML 2.8% (33 mins)
      </text>
    </g>
  </g>
        </g>
      </g>
    </svg>
  </g>
</svg>
